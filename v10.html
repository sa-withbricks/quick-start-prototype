<!doctype html>
<!-- v10: Quick Start v2.1 phone prototype, matched to cmms/webapp/master/src/screens/service-requests/QuickCapture/
     (QuickCaptureScreen.tsx, QuickCaptureCards.tsx, QuickCaptureEditor.tsx, useShutterPress.ts, useHoldToTalkSpeech.ts).
     v2.1 changes only: listen after a tap (4 s ring; talking stops it; pauses don't end it; 1 s tail), cards sit at the top,
     mic on the card, mic in Description, "Description" label, sparkle per AI field (pulses while working, still when done),
     stop button in the talk panel. Rounded-xl = .4rem and rounded-lg = .2rem per tailwind.config.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Quick Start</title>
<style>
/* Tailwind preflight bits the app relies on */
*, ::before, ::after { box-sizing: border-box; border: 0 solid; }
html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; background: #000; overscroll-behavior: none; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; font-weight: 400; color: #fff; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font-family: inherit; font-size: 100%; line-height: inherit; color: inherit; margin: 0; padding: 0; }
button { background: transparent; cursor: pointer; -webkit-user-select: none; user-select: none; }
p { margin: 0; }
[hidden] { display: none !important; }
/* MUI SvgIcon: 1em box, fill currentColor; sx fontSize sets the size */
svg.i { width: 1em; height: 1em; fill: currentColor; display: inline-block; flex-shrink: 0; user-select: none; }

/* QuickCaptureScreen root: fixed inset-0 z-[1200] overflow-hidden bg-black text-white */
#app { position: fixed; inset: 0; overflow: hidden; background: #000; color: #fff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
@media (min-width: 520px) { #app { left: 50%; right: auto; width: 430px; transform: translateX(-50%); } }
/* GLASS = 'bg-black/45 text-white backdrop-blur' */
.glass { background: rgba(0,0,0,.45); color: #fff; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.vf { position: absolute; inset: 0; overflow: hidden; }
.vf video { width: 100%; height: 100%; object-fit: cover; display: block; }
.dim { pointer-events: none; position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .2s; }
.flash { pointer-events: none; position: absolute; inset: 0; background: #fff; animation: flash .35s ease-out forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
/* top row: absolute inset-x-0 top-0 z-[3] flex items-center justify-between p-4 */
.ctop { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.cbtn { display: flex; height: 38px; width: 38px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 20px; }
/* note / intro: absolute inset-x-4 top-[72px] z-[3] rounded-[14px] px-3.5 py-2.5 text-[13px] leading-snug GLASS */
.note { position: absolute; left: 16px; right: 16px; top: calc(72px + env(safe-area-inset-top, 0px)); z-index: 3; border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.375; }
.note.intro { display: flex; align-items: flex-start; gap: 8px; }
.note.intro span { flex: 1; }
.note.intro button { flex: none; padding: 0; color: #fff; font-size: 16px; display: flex; }
/* talk panel: absolute inset-x-4 bottom-[190px] z-[3] rounded-[18px] px-4 py-3.5 GLASS */
.talk { pointer-events: none; position: absolute; left: 16px; right: 16px; bottom: calc(190px + env(safe-area-inset-bottom, 0px)); z-index: 3; border-radius: 18px; padding: 14px 16px; opacity: 0; transform: translateY(8px); transition: all .15s; }
.talk.on { opacity: 1; transform: none; pointer-events: auto; }
.talk p { min-height: 24px; font-size: 1.125rem; font-weight: 600; line-height: 1.375; }
.trow { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
.bars { flex: 1; display: flex; height: 34px; align-items: center; justify-content: center; gap: 4px; }
.bars i { display: block; width: 4px; border-radius: .1275rem; background: #fff; height: 6px; transition: height .5s ease-out; }
.bars.up i { transition: height .07s linear; }
.trow .sp { flex: none; width: 44px; }
.stopb { flex: none; width: 44px; height: 44px; border-radius: 9999px; background: #e53e3e; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
/* cards (QuickCaptureCards.tsx) — v2.1: at the top, under Close/Flash, so the shutter never meets them */
.stack { position: absolute; left: 12px; right: 12px; z-index: 3; display: flex; flex-direction: column; gap: 8px; }
.stack.typing { z-index: 6; flex-direction: column-reverse; }
.card { border-radius: 18px; background: rgba(0,0,0,.45); padding: 8px; color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); touch-action: pan-y; transition: transform .2s, opacity .3s; }
.card.small { padding: 6px 8px; }
.card.fading { opacity: 0; transform: translateY(8px); }
.card .row { display: flex; align-items: center; gap: 12px; }
.card .ph { flex: none; object-fit: cover; height: 56px; width: 56px; border-radius: .4rem; display: block; }
.card.small .ph { height: 36px; width: 36px; border-radius: .2rem; }
.tx { min-width: 0; flex: 1; cursor: pointer; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; }
.nm.heard { font-weight: 500; font-style: italic; opacity: .75; animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
.nm.named { animation: named .7s ease-out; }
@keyframes named { from { background: rgba(255,255,255,.35); } to { background: transparent; } }
.think { height: 14px; width: 60%; border-radius: .375rem; background: rgba(255,255,255,.35); animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
.nmrow { display: flex; align-items: center; gap: 4px; min-width: 0; }
.nmrow .think { flex: none; }
@keyframes pulse { 50% { opacity: .5; } }
.pl { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .75rem; opacity: .8; }
.phd { display: inline-block; height: 9px; width: 64px; border-radius: .375rem; background: rgba(255,255,255,.3); vertical-align: 0; }
.phd.u { width: 44px; }
.said { margin-top: 4px; font-size: .75rem; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Start: flex min-h-[44px] flex-none items-center gap-0.5 rounded-xl bg-white px-3 py-2 text-[14px] font-semibold text-gray-900 */
.start { display: flex; min-height: 44px; flex: none; align-items: center; gap: 2px; border-radius: .4rem; background: #fff; padding: 8px 12px; font-size: 14px; font-weight: 600; color: #1a202c; }
.start .i { font-size: 18px; }
.start:disabled { cursor: default; opacity: .6; }
/* v2.1: mic on the card */
.micb { flex: none; width: 44px; height: 44px; border-radius: 9999px; background: rgba(255,255,255,.2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.micb.on { background: #e53e3e; animation: micpulse 1.2s ease-in-out infinite; }
@keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,.55); } 50% { box-shadow: 0 0 0 6px rgba(229,62,62,0); } }
/* Add a note: mt-2 flex min-h-[44px] w-full items-center gap-2 rounded-xl bg-white/20 px-3 py-2.5 text-left text-[14px] */
.addnote { margin-top: 8px; display: flex; min-height: 44px; width: 100%; align-items: center; gap: 8px; border-radius: .4rem; background: rgba(255,255,255,.2); padding: 10px 12px; text-align: left; font-size: 14px; color: #fff; }
.addnote .i { font-size: 18px; }
.addnote span { opacity: .75; }
.noteform { margin-top: 8px; display: flex; gap: 8px; }
.noteform input { min-width: 0; flex: 1; border-radius: .4rem; background: #fff; padding: 10px 12px; font-size: 1rem; color: #1a202c; outline: none; -webkit-user-select: text; user-select: text; }
.noteform input::placeholder { color: #a0aec0; }
.send { display: flex; height: 44px; width: 44px; flex: none; align-items: center; justify-content: center; border-radius: 9999px; background: #38b2ac; color: #fff; font-size: 24px; }
/* v2.1 AI marks: one sparkle (AutoAwesome) per AI field */
.spk { display: inline-flex; padding: 4px; margin: -4px -4px -4px 0; opacity: .85; line-height: 1; vertical-align: -2px; font-size: 13px; color: inherit; }
.spk.busy { animation: twinkle 1.3s ease-in-out infinite; cursor: default; }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.12); } }
/* bottom: absolute inset-x-0 bottom-0 z-[3] flex flex-col items-center pt-10, pb 28px + safe area, gradient */
.cbottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; padding-top: 40px; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.55)); }
.shwrap { position: relative; width: 92px; height: 92px; }
.shutter { display: flex; height: 92px; width: 92px; cursor: pointer; align-items: center; justify-content: center; border-radius: 9999px; border: 6px solid #fff; background: transparent; padding: 0; touch-action: none; -webkit-touch-callout: none; transition: transform .12s; }
.shutter:disabled { cursor: default; opacity: .5; }
.shutter > span { display: flex; align-items: center; justify-content: center; border-radius: 9999px; height: 70px; width: 70px; background: #fff; transition: all .15s; }
.shutter > span .i { display: none; font-size: 38px; color: #fff; }
.shutter.down { transform: scale(.94); }
.shutter.talking { border-color: rgba(229,62,62,.35); box-shadow: 0 0 0 12px rgba(229,62,62,.25); }

.shutter.talking > span .i { display: inline-block; }
.ring { position: absolute; left: -9px; top: -9px; width: 110px; height: 110px; pointer-events: none; transform: rotate(-90deg); display: none; }
.ring.on { display: block; }
.ring circle { fill: none; stroke: #e53e3e; stroke-width: 4; stroke-linecap: round; }
/* keyboard: absolute bottom-[44px] right-5 flex h-12 w-12 items-center justify-center rounded-full GLASS */
.kbd { position: absolute; right: 20px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); display: flex; height: 48px; width: 48px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 24px; }
.kbd:disabled { opacity: .5; }
.hint { margin-top: 14px; min-height: 20px; font-size: .875rem; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .9; }
.thumb { position: absolute; left: 20px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 4; height: 56px; width: 56px; overflow: hidden; border-radius: 12px; border: 2px solid #fff; }
.thumb img { display: block; height: 100%; width: 100%; object-fit: cover; }
/* editor (QuickCaptureEditor.tsx): absolute inset-0 z-[7] flex flex-col justify-end bg-black/40 */
.ed { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,.4); }
.ed form { margin: 0 10px 10px; display: flex; max-height: 88%; flex-direction: column; gap: 10px; overflow: auto; border-radius: 18px; padding: 12px; outline: none; -webkit-user-select: text; user-select: text; }
.ed .hd { display: flex; align-items: center; gap: 10px; }
.ed .hd img { height: 56px; width: 56px; flex: none; border-radius: .4rem; object-fit: cover; display: block; }
/* LABEL = 'flex min-w-0 flex-1 flex-col gap-1 text-xs' ; FIELD = 'w-full rounded-[10px] border-0 bg-white px-3 py-2.5 text-base text-gray-900' */
.ed label { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 4px; font-size: .75rem; }
.ed .lab { display: flex; align-items: center; gap: 2px; }
.fld { width: 100%; border-radius: 10px; border: 0; background: #fff; padding: 10px 12px; font-size: 1rem; color: #1a202c; }
.fld::placeholder { color: #a0aec0; opacity: 1; }
.fld:focus { outline: 2px solid transparent; }
textarea.fld { min-height: 4rem; resize: none; display: block; }
.dwrap { position: relative; }
.dwrap textarea { padding-right: 52px; }
.dmic { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border-radius: 9999px; background: #edf2f7; color: #4a5568; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.dmic.on { background: #e53e3e; color: #fff; animation: micpulse 1.2s ease-in-out infinite; }
.ed .tw { display: flex; gap: 8px; }
.ed .acts { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed .rm { padding: 8px 4px; font-size: .875rem; font-weight: 600; color: #fed7d7; }
.ed .ok { border-radius: .4rem; background: #fff; padding: 10px 22px; font-size: 15px; font-weight: 600; color: #1a202c; }
.ed .said { margin: -4px 2px 0; }
/* MUI Autocomplete popup (Paper elevation 1, listbox, option) */
.acw { position: relative; }
.acpop { position: absolute; left: 0; right: 0; bottom: calc(100% + 2px); z-index: 2; background: #fff; color: rgba(0,0,0,.87); border-radius: 4px; overflow: auto; max-height: 40vh; box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12); font: 400 1rem/1.5 "Roboto", "Helvetica", "Arial", sans-serif; letter-spacing: .00938em; padding: 8px 0; }
.acpop div { min-height: 48px; display: flex; align-items: center; padding: 6px 16px; cursor: pointer; }
.acpop div.sel { background: rgba(200,120,95,.08); }
.acpop .none { color: rgba(0,0,0,.6); padding: 14px 16px; min-height: 0; cursor: default; }
/* the screens Start and Close move on to (not part of this screen) */
.page { position: absolute; inset: 0; z-index: 9; background: #f7fafc; color: #1a202c; display: flex; flex-direction: column; }
.page .bar { padding: env(safe-area-inset-top, 0px) 12px 0; height: calc(56px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px; color: #fff; background: linear-gradient(90deg, #323741 0%, #20242b 100%); font-weight: 600; }
.page .bar button { color: #fff; display: flex; font-size: 24px; padding: 4px; }
.page .bd { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.page h2 { margin: 0; font-size: 18px; font-weight: 600; }
.page .meta { font-size: 14px; color: #4a5568; }
.page .go { align-self: flex-start; margin-top: 12px; display: flex; align-items: center; gap: 8px; border-radius: .2rem; background: #c8785f; color: #fff; padding: 10px 16px; font-size: 15px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .spk.busy, .micb.on, .dmic.on, .think, .nm.heard, .nm.named, .flash { animation: none; } .flash { display: none; } .dim, .talk, .shutter, .shutter > span, .card { transition: none; } }
</style>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ico = function (n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; };

  /* real: useShutterPress holdMs 320 / guardMs 700, cards FADE_MS 12000, SWIPE_PX 90, TAP_SLOP_PX 5, MAX_SHOWN 3.
     v2.1: WINDOW_MS listen after a tap, SILENCE_MS ends it, TAIL_MS after every stop. AI_MS is the stand-in fill. */
  var HOLD_MS = 320, GUARD_MS = 700, FADE_MS = 12000, FADE_OUT_MS = 300, SWIPE_PX = 90, TAP_SLOP_PX = 5, MAX_SHOWN = 3;
  var WINDOW_MS = 4000, SILENCE_MS = 4000, TAIL_MS = 1000, AI_MS = 2500;
  var HINT = 'Tap: photo · Hold: photo + voice note';
  var INTRO_KEY = 'quickCapture.introDismissed';

  var PLACES = ['Mansion', 'Grounds', 'North Treatment Center'];
  var UNITS = { Mansion: ['AC unit', 'Boiler'], Grounds: ['Irrigation pump'], 'North Treatment Center': ['Water heater'] };
  var UNIT_WORDS = [[/\b(ac|a\/c|air ?con\w*|hvac|cooling)\b/i, 'AC unit', 'Mansion'], [/\bboiler\b/i, 'Boiler', 'Mansion'], [/\b(pump|irrigation|sprinkler)s?\b/i, 'Irrigation pump', 'Grounds'], [/\bwater heater\b/i, 'Water heater', 'North Treatment Center']];
  var HERE = 'Mansion'; /* stands in for the phone point */

  var caps = [], seq = 0, openId = null, noteId = null, drafts = {}, saidEd = false, edDirty = {};

  stackEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = +e.target.dataset.form, c = find(id), text = (drafts[id] || '').trim();
    setNote(null);
    if (text) { drafts[id] = ''; c.words = text; runAI(c); }
    armFade(c);
  });

  /* ---------- editor (QuickCaptureEditor.tsx) ---------- */
  function openEditor(c) {
    if (ses) finish(ses);
    openId = c.id; saidEd = false; edDirty = {};
    drawEditor(c);
    var f = $('ed').querySelector('form'); if (f) f.focus();
  }
  function nameOf(c) { return c.ai === 'done' ? c.title || '' : ''; }
  function drawEditor(c) {
    var done = c.ai === 'done', working = c.ai === 'working';
    var mark = function (f) { return working ? spk(c.id, true) : done && c.marks[f] ? spk(c.id) : ''; };
    var units = done ? UNITS[c.place] || [] : [];
    $('ed').innerHTML = '<form class="glass" role="dialog" aria-modal="true" aria-label="Edit" tabindex="-1">' +
      '<div class="hd">' + (c.photo ? '<img alt="" src="' + c.photo + '">' : '') + '<label><span class="lab">Name' + mark('title') + '</span><input class="fld" id="edName" autocomplete="off" value="' + esc(nameOf(c)) + '"' + (working ? ' placeholder="Naming…"' : '') + '></label></div>' +
      (saidEd && done ? '<div class="said">' + saidText(c) + '</div>' : '') +
      '<label>Description<div class="dwrap"><textarea class="fld" id="edDesc" rows="2">' + esc(c.words) + '</textarea>' +
      '<button type="button" class="dmic' + (ses && ses.editor ? ' on' : '') + '" id="dmic" aria-label="Talk">' + ico('mic') + '</button></div></label>' +
      '<div class="tw"><label><span class="lab">Place' + mark('place') + '</span><div class="acw"><input class="fld" id="edPlace" autocomplete="off" role="combobox" value="' + esc(done ? c.place || '' : '') + '"' + (working ? ' placeholder="Finding…"' : '') + '><div class="acpop" id="acpop" hidden></div></div></label>' +
      '<label><span class="lab">Unit' + mark('unit') + '</span><select class="fld" id="edUnit"><option value="">' + (working ? 'Finding…' : 'None') + '</option>' +
      units.map(function (u) { return '<option' + (u === c.unit ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></label></div>' +
      '<div class="acts"><button type="button" class="rm" id="edRm">Remove request</button><button type="submit" class="ok">Save</button></div></form>';
    $('ed').hidden = false;
  }
  function keepDraft(c, onlyDirty) {
    if ($('ed').hidden) return;
    var v = { edName: $('edName').value, edDesc: $('edDesc').value, edPlace: $('edPlace').value, edUnit: $('edUnit').value };
    drawEditor(c);
    if (!onlyDirty || edDirty.edName) $('edName').value = v.edName;
    if (!onlyDirty || edDirty.edDesc) $('edDesc').value = v.edDesc;
    if (!onlyDirty || edDirty.edPlace) { $('edPlace').value = v.edPlace; fillUnits(v.edUnit); }
    else if (!onlyDirty || edDirty.edUnit) { if ([].some.call($('edUnit').options, function (o) { return o.value === v.edUnit; })) $('edUnit').value = v.edUnit; }
  }
  function fillUnits(keep) {
    var list = UNITS[$('edPlace').value] || [], sel = $('edUnit');
    sel.innerHTML = '<option value="">None</option>' + list.map(function (u) { return '<option>' + u + '</option>'; }).join('');
    if (list.indexOf(keep) >= 0) sel.value = keep;
  }
  /* Place: MUI Autocomplete — type to filter, pick from the list */
  function showPop() {
    var inp = $('edPlace'), pop = $('acpop'); if (!inp) return;
    var q = inp.value.trim().toLowerCase(), cur = inp.value;
    var list = PLACES.filter(function (p) { return !q || PLACES.indexOf(cur) >= 0 || p.toLowerCase().indexOf(q) >= 0; });
    pop.innerHTML = list.length ? list.map(function (p) { return '<div data-pl="' + esc(p) + '"' + (p === cur ? ' class="sel"' : '') + '>' + esc(p) + '</div>'; }).join('') : '<div class="none">No options</div>';
    pop.hidden = false;
  }
  $('ed').addEventListener('focusin', function (e) { if (e.target.id === 'edPlace') showPop(); });
  $('ed').addEventListener('focusout', function (e) { if (e.target.id === 'edPlace') setTimeout(function () { var p = $('acpop'); if (p) p.hidden = true; var i = $('edPlace'); if (i && PLACES.indexOf(i.value) < 0) { i.value = ''; } }, 150); });
  $('ed').addEventListener('input', function (e) { if (e.target.id) edDirty[e.target.id] = true; if (e.target.id === 'edPlace') showPop(); });
  $('ed').addEventListener('change', function (e) { if (e.target.id) edDirty[e.target.id] = true; });
  $('ed').addEventListener('pointerdown', function (e) {
    var o = e.target.closest('[data-pl]'); if (!o) return;
    e.preventDefault();
    var c = find(openId), keep = $('edUnit').value;
    $('edPlace').value = o.dataset.pl; edDirty.edPlace = true; edDirty.edUnit = true;
    var stays = c && o.dataset.pl === c.place && keep === c.unit;
    fillUnits(stays || (UNITS[o.dataset.pl] || []).indexOf(keep) >= 0 ? keep : '');
    $('acpop').hidden = true; $('edPlace').blur();
  });
  $('ed').addEventListener('keydown', function (e) { if (e.key === 'Escape') closeEditor(); });
  $('ed').addEventListener('click', function (e) {
    var c = find(openId); if (!c) return;
    if (e.target === $('ed')) { closeEditor(); return; }
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.spk) { saidEd = !saidEd; keepDraft(c); return; }
    if (b.id === 'dmic') {
      if (ses && ses.editor) { stopSoon(ses, TAIL_MS); return; }
      edDirty.edDesc = true;
      listen('open', { editor: true, base: $('edDesc').value, onText: function (t) { var x = $('edDesc'); if (x) { x.value = t; x.scrollTop = x.scrollHeight; } } });
      return;
    }
    if (b.id === 'edRm') { c.hidden = true; closeEditor(); }
  });
  $('ed').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = find(openId); if (ses && ses.editor) finish(ses);
    var n = $('edName').value.trim(), t = $('edDesc').value.trim(), p = PLACES.indexOf($('edPlace').value) >= 0 ? $('edPlace').value : null, u = $('edUnit').value || null;
    var wordsChanged = t !== c.words.trim();
    if (edDirty.edName && n && n !== nameOf(c).trim()) { c.title = n; c.edited.title = true; c.marks.title = false; }
    if (edDirty.edPlace && p !== c.place) { c.place = p; c.edited.place = true; c.marks.place = false; }
    if (edDirty.edUnit && u !== c.unit) { c.unit = u; c.edited.unit = true; c.marks.unit = false; }
    if (wordsChanged) c.words = t;
    closeEditor();
    if (wordsChanged && t) runAI(c);
  });
  function closeEditor() {
    if (ses && ses.editor) finish(ses);
    var c = find(openId); openId = null; $('ed').hidden = true; $('ed').innerHTML = '';
    if (c) armFade(c); render();
  }

  /* ---------- Start opens the job (/work/:id/working); Close goes back to Work ---------- */
  function startJob(c, b) {
    b.disabled = true; if (ses) finish(ses);
    setTimeout(function () {
      stopCamera();
      var w = $('page');
      w.innerHTML = '<div class="bar"><button type="button" id="back" aria-label="Back">' + ico('back') + '</button>Working</div>' +
        '<div class="bd"><h2>' + esc(c.title || c.words || 'Quick Start') + '</h2><div class="meta">' + esc([c.place, c.unit].filter(Boolean).join(' · ')) + '</div>' +
        (c.words ? '<div class="meta">' + esc(c.words) + '</div>' : '') + '</div>';
      w.hidden = false;
      $('back').addEventListener('click', function () { w.hidden = true; c.hidden = true; render(); startCamera(); });
    }, 400);
  }
  $('close').addEventListener('click', function () {
    if (ses) finish(ses); stopCamera();
    var w = $('page');
    w.innerHTML = '<div class="bar">Work</div><div class="bd"><button type="button" class="go" id="reopen">' + ico('cam') + 'Quick Start</button></div>';
    w.hidden = false;
    $('reopen').addEventListener('click', function () { w.hidden = true; startCamera(); });
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && ses) finish(ses); });

  render(); startCamera();
})();
</script>
</body>
</html>
