     horizontal, flies the card out; tapping empty camera space folds an open pile; Add photo in the editor (the camera
     comes back, the next tap adds to that job); editor laid out like the spec visual (photos row, then Name).
     v13 (from v12, Sam 11/4 on the v2.1 spec visual): the talk panel opens at the tap and IS the capture (no duplicate card
     while listening): photo, "Listening…", bars and a draining countdown bar, then his words; when it ends the panel
     rises into the card stack. Instructions live in one small line between Close and Flash and change with the state.
     Cards stack like iPhone notifications: newest on top with the rest tucked behind; "N more" opens them all, with
     Show less and Clear all.
     v12 (from v11): a fresh recognizer after any capture with words (Android fires sound/speech start only once per recognizer, so a second capture never stopped its countdown); every card shown, newest on top, older ones scroll.
     v11 (from v10): Quick Start v2.1 phone prototype, matched to cmms/webapp/master/src/screens/service-requests/QuickCapture/
     (QuickCaptureScreen.tsx, QuickCaptureCards.tsx, QuickCaptureEditor.tsx, useShutterPress.ts, useHoldToTalkSpeech.ts).
     v2.1 changes only: listen after a tap (4 s ring; talking stops it; pauses don't end it; 1 s tail), cards sit at the top,
     mic on the card, mic in Description, "Description" label, sparkle per AI field (pulses while working, still when done),

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ico = function (n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; };

  /* v11: a press under HOLD_MS is a tap (words heard during it are kept); longer = hold-to-talk.
     No fade: cards leave only when swiped (v11 rule, the real app fades at 12 s).
     GUARD_MS only stops a bounce, not a quick second photo (the real 700 ms guard ate quick taps). */
  var HOLD_MS = 800, GUARD_MS = 250, SWIPE_PX = 90, TAP_SLOP_PX = 5, MAX_SHOWN = 3;
  var WINDOW_MS = 4000, SILENCE_MS = 4000, TAIL_MS = 1000, AI_MS = 2500, ENGINE_IDLE_MS = 1500;
  var HINT = 'Tap: photo · Hold: photo + voice note';
  var INTRO_KEY = 'quickCapture.introDismissed';

  var PLACES = ['Mansion', 'Grounds', 'North Treatment Center'];
  var UNITS = { Mansion: ['AC unit', 'Boiler'], Grounds: ['Irrigation pump'], 'North Treatment Center': ['Water heater'] };
  var UNIT_WORDS = [[/\b(ac|a\/c|air ?con\w*|hvac|cooling)\b/i, 'AC unit', 'Mansion'], [/\bboiler\b/i, 'Boiler', 'Mansion'], [/\b(pump|irrigation|sprinkler)s?\b/i, 'Irrigation pump', 'Grounds'], [/\bwater heater\b/i, 'Water heater', 'North Treatment Center']];
  var HERE = 'Mansion'; /* stands in for the phone point */

  var caps = [], seq = 0, openId = null, noteId = null, drafts = {}, saidEd = false, edDirty = {};
  var addFor = null, edKeep = null;
  var press = null, lastRelease = null, ses = null, videoReady = false, micOK = false, expanded = false, clearArm = null;

  /* ---- ?debug=1: event log ---- */
  var DEBUG = /[?&]debug=1\b/.test(location.search), T0 = performance.now(), dbgLines = [];
  function log(m) {
    if (!DEBUG) return;
    dbgLines.push('+' + String(Math.round(performance.now() - T0)).padStart(6, ' ') + 'ms  ' + m);
    if (dbgLines.length > 40) dbgLines.shift();
    var d = $('dbg'); d.hidden = false; d.textContent = dbgLines.slice().reverse().join('\n');
  }

  function clock() { var d = new Date(), h = d.getHours() % 12 || 12; return h + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + (d.getHours() < 12 ? 'AM' : 'PM'); }
  function formatHeld(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function find(id) { for (var i = 0; i < caps.length; i++) if (caps[i].id === id) return caps[i]; return null; }
  function joinW(a, b) { a = (a || '').trim(); b = (b || '').trim(); return a && b ? a + ' ' + b : a || b; }
  function readFlag(k) { try { return localStorage.getItem(k) === '1'; } catch (x) { return false; } }
  function writeFlag(k) { try { localStorage.setItem(k, '1'); } catch (x) {} }

  function newCap(photo, words) {
    var c = { id: ++seq, photo: photo, photos: photo ? [photo] : [], words: words || '', ai: 'idle', title: null, place: null, unit: null, marks: {}, edited: {}, time: clock(), hidden: false, named: false, said: false };
    caps.push(c);
    return c;
  }

  /* ---- stand-in AI fill ---- */
  function titleFrom(text) {
    var s = text.split(/[,.;!?]| but | and then | so that /i)[0].trim();
    s = s.replace(/^((so|um|uh|okay|ok|hey|alright|right)\b[ ,]*)+/i, '').replace(/\s+/g, ' ').trim();
    var w = s.split(' ').slice(0, 6).join(' ');
    return w ? w.charAt(0).toUpperCase() + w.slice(1) : '';
  }
  function runAI(c) {
    c.ai = 'working'; c.said = false;
    var at = c.aiRun = (c.aiRun || 0) + 1;
    render(); if (openId === c.id) keepDraft(c, true);
    setTimeout(function () {
      if (c.aiRun !== at) return;
      var text = c.words.toLowerCase(), place = null, unit = null;
      PLACES.forEach(function (p) { if (!place && text.indexOf(p.toLowerCase()) >= 0) place = p; });
      UNIT_WORDS.forEach(function (u) { if (!unit && u[0].test(text) && (!place || place === u[2])) { unit = u[1]; place = place || u[2]; } });
      var t = c.words ? titleFrom(c.words) : '';
      c.marks = {};
      if (!c.edited.title) { if (t) { c.title = t; c.marks.title = true; } else c.title = 'Photo at ' + (place || HERE) + ' · ' + c.time; }
      if (!c.edited.place) { c.place = place || HERE; c.marks.place = true; }
      if (!c.edited.unit) { c.unit = unit; if (unit) c.marks.unit = true; }
      c.ai = 'done'; c.named = true;
      render(); if (openId === c.id) keepDraft(c, true);
    }, AI_MS);
  }

  /* ---------- camera ---------- */
  var video = null, track = null;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function note(t) { $('note').textContent = t || ''; $('note').hidden = !t || noteId !== null; layout(); }
  function startCamera() {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { cameraFailed('Camera Unavailable'); return; }
    var v = { facingMode: 'environment' };
    /* camera + mic asked together for the permission only; the audio track is stopped at once, because
       Android Chrome can't give the mic to SpeechRecognition while a getUserMedia audio track holds it */
    md.getUserMedia({ video: v, audio: true }).then(function (s) { return { s: s, mic: true }; }, function () { return md.getUserMedia({ video: v }).then(function (s) { return { s: s, mic: false }; }); })
      .then(function (r) {
        var s = r.s;
        s.getAudioTracks().forEach(function (t) { s.removeTrack(t); t.stop(); });
        micOK = r.mic;
        log('camera ok, mic ' + (r.mic ? 'allowed' : 'blocked') + ', speech ' + (SR ? 'available' : 'missing'));
        note(!r.mic ? 'Mic blocked: holding still works, but no words. Allow the mic in site settings.' : !SR ? 'This browser can\'t turn speech into words. Try Chrome on Android or Safari on iPhone.' : '');
        video = document.createElement('video');
        video.muted = true; video.autoplay = true; video.playsInline = true; video.setAttribute('playsinline', '');
        video.srcObject = s;
        $('vf').innerHTML = ''; $('vf').appendChild(video);
        video.addEventListener('loadeddata', function () {
          videoReady = true; $('shutter').disabled = false; $('kbd').disabled = false;
          try { var cp = track && track.getCapabilities && track.getCapabilities(); $('torch').hidden = !(cp && cp.torch); } catch (x) {}
        }, { once: true });
        var p = video.play(); if (p && p.catch) p.catch(function () {});
        track = s.getVideoTracks()[0] || null;
      })
      .catch(function (e) {
        var n = e && e.name;
        log('camera failed ' + n);
        cameraFailed(n === 'NotAllowedError' || n === 'SecurityError' ? 'Camera blocked: allow it in site settings, then reopen.' : n === 'NotReadableError' ? 'Another app is using the camera. Close it, then try again.' : 'We couldn\'t find a camera on this device.');
      });
  }
  function cameraFailed(t) { videoReady = false; $('shwrap').hidden = true; $('kbd').hidden = true; $('hint').hidden = true; note(t); }
  function stopCamera() { if (video && video.srcObject) video.srcObject.getTracks().forEach(function (t) { t.stop(); }); video = null; track = null; videoReady = false; $('torch').hidden = true; $('shutter').disabled = true; $('kbd').disabled = true; }
  $('torch').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true', b = this;
    if (!track) return;
    track.applyConstraints({ advanced: [{ torch: on }] }).then(function () { b.setAttribute('aria-pressed', String(on)); b.innerHTML = ico(on ? 'flash-on' : 'flash-off'); }).catch(function () {});
  });
  function snap() {
    if (!video || !video.videoWidth) return null;
    var c = document.createElement('canvas'), w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 1280 / Math.max(w, h));
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .85);
  }
  function flashOnce() { var f = document.createElement('div'); f.className = 'flash'; $('flashes').innerHTML = ''; $('flashes').appendChild(f); }
  $('introX').addEventListener('click', function () { writeFlag(INTRO_KEY); introShown = false; $('intro').hidden = true; layout(); });

  /* ---------- sound level: from recognition events only (no second audio stream on Android) ---------- */
  var lv = 0, BARS = [0.45, 0.7, 0.9, 1, 0.8, 1, 0.9, 0.7, 0.45];
  function kick(v) { lv = Math.max(lv, v); }
  (function frame() {
    var s = ses, recording = s && !s.done && (s.kind === 'rec' || s.kind === 'hold'), waiting = s && !s.done && (s.kind === 'press' || s.kind === 'window');
    if (recording) lv = Math.max(lv, 0.12 + 0.08 * Math.sin(performance.now() / 260));
    if (waiting) lv = Math.max(lv, 0.06 + 0.05 * Math.sin(performance.now() / 300)); /* gentle pulse between words */
    lv *= 0.9; if (lv < 0.01) lv = 0;
    document.getElementById('app').style.setProperty('--lv', lv.toFixed(3));
    if ($('talk').classList.contains('on')) {
      [].forEach.call($('bars').children, function (b, k) { b.style.height = (6 + 28 * BARS[k] * Math.min(1, lv) * (0.8 + Math.random() * 0.2)) + 'px'; });
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- speech engine ----------
     One recognizer, shared by sessions. A new session takes over a recognizer that is still running (no abort +
     restart between quick taps, which Android answers late or not at all). It is only aborted after
     ENGINE_IDLE_MS with no session. If one is still ending, the next start waits for its onend.
     If Chrome ends recognition on its own (pause, no-speech) while a session is open, it starts again and the
     words so far are kept. Real merge of Android's repeated finals (useHoldToTalkSpeech.mergeTranscript). */
  var E = { rec: null, st: 'idle', owner: null, n: 0, idleT: null, pending: false, gen: 0, fails: 0, heard: false, stopT: null, live: false };
  var BACKOFF = [150, 300, 600, 900, 1200, 1500, 1500, 1500, 1500, 1500];
  function retryLater(why) {
    var k = E.fails++;
    if (k >= BACKOFF.length) { log('engine: gave up for this capture (' + why + ')'); return; }
    log('engine: retry in ' + BACKOFF[k] + ' ms (' + why + ')');
    setTimeout(function () { if (!E.rec && E.owner && !E.owner.done) startEngine(); }, BACKOFF[k]);
  }
  var wordsOf = function (t) { return t.toLowerCase().split(/\s+/).map(function (w) { return w.replace(/[.,!?;:]+$/g, ''); }).filter(Boolean); };
  var startsWithWords = function (words, prefix) { return prefix.every(function (w, i) { return words[i] === w; }); };
  function mergeFrom(s, ev) {
    var finals = s.finals.slice(), interim = [];
    for (var i = Math.max(ev.resultIndex, s.offset); i < ev.results.length; i++) {
      var r = ev.results[i], t = r[0].transcript, k = i - s.offset;
      if (!r.isFinal) { interim.push(t); continue; }
      finals[k] = t;
      var words = wordsOf(t); if (!words.length) continue;
      for (var j = k - 1; j >= 0; j--) { if (!finals[j]) continue; if (startsWithWords(words, wordsOf(finals[j]))) finals[j] = ''; break; }
    }
    s.finals = finals;
    return finals.concat([interim.join(' ')]).map(function (p) { return (p || '').trim(); }).filter(Boolean).join(' ');
  }
  function want(s) {
    clearTimeout(E.idleT);
    if (E.owner !== s) E.fails = 0;
    E.owner = s; s.offset = E.st === 'running' ? E.n : 0;
    if (!SR || !micOK) return;
    if ((E.st === 'running' || E.st === 'starting') && E.heard) { log('engine: spent (heard sound before), fresh one'); recycle(); return; }
    if (E.st === 'running' || E.st === 'starting') { log('engine: take over (' + E.st + ', nothing heard yet)'); return; }
    if (E.st === 'stopping') { E.pending = true; log('engine: queued behind stopping'); return; }
    startEngine();
  }
  function startEngine() {
    var r;
    try { r = new SR(); } catch (x) { log('engine: constructor failed ' + x.name); return; }
    r.lang = 'en-US'; r.continuous = true; r.interimResults = true;
    E.rec = r; E.st = 'starting'; E.n = 0; E.gen++; E.heard = false; E.live = false; clearTimeout(E.stopT);
    if (E.owner) { E.owner.offset = 0; E.owner.finals = []; }
    r.onstart = function () { if (E.rec === r) { E.st = 'running'; E.fails = 0; } log('rec start'); };
    r.onaudiostart = function () {
      log('rec audiostart');
      if (E.rec !== r) return;
      E.live = true;
      var o = E.owner;
      if (o && !o.done && o.kind === 'window' && !o.voice) { o.tw = Date.now(); startDrain(); }
      paintWords();
    };
    r.onsoundstart = function () { log('rec soundstart'); if (E.rec === r) E.heard = true; voice('sound'); };
    r.onspeechstart = function () { log('rec speechstart'); if (E.rec === r) E.heard = true; voice('speech'); };
    r.onresult = function (ev) {
      if (E.rec !== r) return;
      E.n = ev.results.length; E.heard = true;
      var s = E.owner;
      var last = ev.results[ev.results.length - 1];
      log('rec result ' + (last.isFinal ? 'final' : 'interim') + ' "' + last[0].transcript.slice(-40) + '"');
      if (!s || s.done) return;
      var now = mergeFrom(s, ev);
      if (now !== s.cur) { s.cur = now; s.last = Date.now(); kick(1); if (s.cur) voice('words'); }
      say(s);
    };
    r.onerror = function (ev) {
      log('rec error ' + ev.error);
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { micOK = false; note('Mic blocked: holding still works, but no words. Allow the mic in site settings.'); }
    };
    r.onend = function () {
      log('rec end');
      if (E.rec !== r) return;
      E.rec = null; E.st = 'idle';
      var s = E.owner;
      if (s && !s.done) { s.prefix = s.text(); s.cur = ''; s.finals = []; }
      E.live = false; paintWords();
      if (micOK && (E.pending || (s && !s.done))) { E.pending = false; retryLater('ended'); }
    };
    try { r.start(); log('rec start() called'); }
    catch (x) {
      log('rec start() threw ' + x.name);
      E.rec = null; E.st = 'idle'; E.live = false;
      retryLater('start threw');
    }
  }
  /* Chrome fires soundstart/speechstart once per recognizer, so a recognizer that has heard anything can't tell
     the next capture that he started talking. Abort it and start a fresh one when its onend comes (or after 800 ms). */
  function recycle() {
    if (!E.rec) { if (E.owner && !E.owner.done) startEngine(); return; }
    E.st = 'stopping'; E.live = false; E.pending = !!(E.owner && !E.owner.done); paintWords();
    var r = E.rec;
    try { r.abort(); } catch (x) {}
    clearTimeout(E.stopT);
    E.stopT = setTimeout(function () {
      if (E.rec !== r || E.st !== 'stopping') return;
      log('engine: no onend after abort, starting anyway');
      E.rec = null; E.st = 'idle';
      if (E.pending && E.owner && !E.owner.done) { E.pending = false; startEngine(); }
    }, 800);
  }
  function releaseEngine(s) {
    if (E.owner !== s) return;
    E.owner = null; clearTimeout(E.idleT);
    if (E.heard && E.rec) { log('engine: spent, abort now'); recycle(); return; }
    E.idleT = setTimeout(function () {
      if (E.owner || !E.rec) return;
      E.st = 'stopping'; log('engine: idle, abort');
      try { E.rec.abort(); } catch (x) { E.rec = null; E.st = 'idle'; }
    }, ENGINE_IDLE_MS);
  }

  /* ---------- sessions ----------
     'press': finger down (< HOLD_MS)  → 'window' on release, or 'rec' if he already spoke
     'window': listening, WINDOW_MS to start talking (draining ring); nothing = ends quietly, card is photo-only
     'rec': recording; ends on stop, card mic, or SILENCE_MS with nothing new; every stop keeps TAIL_MS
     'hold': finger held ≥ HOLD_MS; release = TAIL_MS more, then saved */
  function listen(kind, o) {
    if (ses) finish(ses);
    var s = ses = { kind: kind, cap: o.cap || null, editor: !!o.editor, base: o.base || '', prefix: '', cur: '', finals: [], offset: 0, t0: Date.now(), last: Date.now(), voice: false, ending: false, done: false, onText: o.onText, onDone: o.onDone };
    s.text = function () { return joinW(s.prefix, s.cur); };
    log('session ' + kind + (s.editor ? ' (Description)' : s.cap ? ' (card ' + s.cap.id + ')' : ''));
    want(s);
    s.tick = setInterval(function () { tickSes(s); }, 100);
    showSes();
    return s;
  }
  /* sound, speech or the first interim result: stop the countdown, start recording */
  function voice(why) {
    var s = E.owner; if (!s || s.done) return;
    s.last = Date.now(); kick(why === 'words' ? 1 : 0.6);
    if (s.voice) return;
    s.voice = true;
    if (s.kind === 'window') { log('countdown stopped by ' + why); s.kind = 'rec'; s.t0 = Date.now(); showSes(); }
  }
  function tickSes(s) {
    if (s.done) return;

  $('ed').addEventListener('input', function (e) { if (e.target.id) edDirty[e.target.id] = true; if (e.target.id === 'edPlace') showPop(); });
  $('ed').addEventListener('change', function (e) { if (e.target.id) edDirty[e.target.id] = true; });
  $('ed').addEventListener('pointerdown', function (e) {
    var o = e.target.closest('[data-pl]'); if (!o) return;
    e.preventDefault();
    var c = find(openId), keep = $('edUnit').value;
    $('edPlace').value = o.dataset.pl; edDirty.edPlace = true; edDirty.edUnit = true;
    var stays = c && o.dataset.pl === c.place && keep === c.unit;
    fillUnits(stays || (UNITS[o.dataset.pl] || []).indexOf(keep) >= 0 ? keep : '');
    $('acpop').hidden = true; $('edPlace').blur();
  });
  $('ed').addEventListener('keydown', function (e) { if (e.key === 'Escape') closeEditor(); });
  $('ed').addEventListener('click', function (e) {
    var c = find(openId); if (!c) return;
    if (e.target === $('ed')) { closeEditor(); return; }
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.spk) { saidEd = !saidEd; keepDraft(c); return; }
    if (b.id === 'dmic') {
      if (ses && ses.editor) { log('Description mic: stop'); stopSoon(ses, TAIL_MS); return; }
      log('Description mic: talk');
      edDirty.edDesc = true;
      /* appends live to what is already in the box, with a space */
      listen('rec', { editor: true, base: $('edDesc').value, onText: function (t) { var x = $('edDesc'); if (x) { x.value = t; x.scrollTop = x.scrollHeight; } } });
      return;
    }
    if (b.id === 'edRm') { c.hidden = true; closeEditor(); }
    if (b.dataset.rmph != null) { c.photos.splice(+b.dataset.rmph, 1); c.photo = c.photos[0] || null; keepDraft(c); return; }
    if (b.id === 'edAddPh') {
      /* the camera comes back; the next tap adds to this job */
      edKeep = { id: c.id, v: { edName: $('edName').value, edDesc: $('edDesc').value, edPlace: $('edPlace').value, edUnit: $('edUnit').value }, dirty: edDirty };
      if (ses && ses.editor) finish(ses);
      addFor = c.id; $('ed').hidden = true;
      $('addph').style.backgroundImage = c.photo ? 'url(' + c.photo + ')' : '';
      $('addtx').textContent = 'Tap to add a photo to “' + (nameOf(c) || 'this job') + '”';
      $('addbar').hidden = false; tip();
    }
  });
  $('ed').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = find(openId); if (ses && ses.editor) finish(ses);
    var n = $('edName').value.trim(), t = $('edDesc').value.trim(), p = PLACES.indexOf($('edPlace').value) >= 0 ? $('edPlace').value : null, u = $('edUnit').value || null;
    var wordsChanged = t !== c.words.trim();
    if (edDirty.edName && n && n !== nameOf(c).trim()) { c.title = n; c.edited.title = true; c.marks.title = false; }
    if (edDirty.edPlace && p !== c.place) { c.place = p; c.edited.place = true; c.marks.place = false; }
    if (edDirty.edUnit && u !== c.unit) { c.unit = u; c.edited.unit = true; c.marks.unit = false; }
    if (wordsChanged) c.words = t;
    closeEditor();
    if (wordsChanged && t) runAI(c);
  });
  function endAdd(photo) {
    var c = find(addFor); addFor = null; $('addbar').hidden = true;
    if (!c) { tip(); return; }
    if (photo) { c.photos.push(photo); c.photo = c.photos[0]; }
    openId = c.id; edDirty = edKeep ? edKeep.dirty : {}; drawEditor(c);
    if (edKeep) { var v = edKeep.v; $('edName').value = v.edName; $('edDesc').value = v.edDesc; $('edPlace').value = v.edPlace; fillUnits(v.edUnit); }
    edKeep = null; render(); tip();
  }
  $('addX').addEventListener('click', function () { endAdd(null); });
  function closeEditor() {
    if (ses && ses.editor) finish(ses);
    openId = null; $('ed').hidden = true; $('ed').innerHTML = '';
    render();
  }

  /* ---------- Start opens the job (/work/:id/working); Close goes back to Work ---------- */
  function startJob(c, b) {
    b.disabled = true; if (ses) finish(ses);
    setTimeout(function () {
      stopCamera();
      var w = $('page');
      w.innerHTML = '<div class="bar"><button type="button" id="back" aria-label="Back">' + ico('back') + '</button>Working</div>' +
        '<div class="bd"><h2>' + esc(c.title || c.words || 'Quick Start') + '</h2><div class="meta">' + esc([c.place, c.unit].filter(Boolean).join(' · ')) + '</div>' +
        (c.words ? '<div class="meta">' + esc(c.words) + '</div>' : '') + '</div>';
      w.hidden = false;
      $('back').addEventListener('click', function () { w.hidden = true; c.hidden = true; render(); startCamera(); });
    }, 400);
  }
  $('close').addEventListener('click', function () {
    if (ses) finish(ses); stopCamera();
    var w = $('page');
    w.innerHTML = '<div class="bar">Work</div><div class="bd"><button type="button" class="go" id="reopen">' + ico('cam') + 'Quick Start</button></div>';
    w.hidden = false;
    $('reopen').addEventListener('click', function () { w.hidden = true; startCamera(); });
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && ses) finish(ses); });

  log('debug on');
  render(); startCamera();
})();
</script>
</body>
</html>
