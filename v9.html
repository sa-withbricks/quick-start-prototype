     Tap = photo, then ~4 s listening; talk = keeps recording until stop or ~4 s silence (+1 s tail).
     Card mic and editor Description mic re-engage. Hold = talk while held (+1 s tail). AI is faked (~2.5 s). -->

<style>

.thumb { position: absolute; left: 20px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 4; width: 56px; height: 56px; border-radius: .4rem; border: 2px solid #fff; overflow: hidden; }

.ed .tw { display: flex; gap: 8px; }
.ed .acts { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed .rm { border: 0; background: transparent; padding: 8px 4px; font-size: 14px; font-weight: 600; color: #fed7d7; cursor: pointer; }
.ed .ok { border: 0; border-radius: .4rem; background: #fff; color: #1a202c; padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }

.page { position: absolute; inset: 0; z-index: 9; background: #f7fafc; color: #1a202c; display: flex; flex-direction: column; }

.page .bar button { border: 0; background: transparent; color: #fff; cursor: pointer; display: flex; font-size: 24px; padding: 4px; }
.page .bd { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.page h2 { margin: 0; font-size: 18px; font-weight: 600; }
.page .meta { font-size: 14px; color: #4a5568; }
.page .pillw { align-self: flex-start; margin-top: 6px; font-size: 12px; font-weight: 600; border-radius: 9999px; padding: 2px 10px; background: #e6f4ec; color: #1b6e49; border: 1px solid #cde8d8; }
.page .go { align-self: flex-start; margin-top: 12px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: .2rem; background: #c8785f; color: #fff; padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }

</style>
</head>

<div id="app">
  <div class="vf" id="vf"></div>
  <div class="dim" id="dim"></div>
  <div class="flash" id="flash"></div>
  <div class="ctop">
    <button type="button" class="cbtn glass" id="close" aria-label="Close"><svg class="i"><use href="#i-close"/></svg></button>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ico = function (n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; };

  var HOLD_MS = 320, GUARD_MS = 700, WINDOW_MS = 4000, SILENCE_MS = 4000, TAIL_MS = 1000, AI_MS = 2500, FADE_MS = 12000, SWIPE_PX = 90, MAX_SHOWN = 3;
  var REST = 'Tap: photo, then talk · Hold: talk';

  /* ---- places and units (Guest House) ---- */
  var PLACES = ['Mansion', 'Grounds', 'North Treatment Center'];
  var UNITS = { Mansion: ['AC unit', 'Boiler'], Grounds: ['Irrigation pump'], 'North Treatment Center': ['Water heater'] };
  var UNIT_WORDS = [[/\b(ac|a\/c|a c|air ?con\w*|hvac|cooling)\b/i, 'AC unit', 'Mansion'], [/\bboiler\b/i, 'Boiler', 'Mansion'], [/\b(pump|irrigation|sprinkler)s?\b/i, 'Irrigation pump', 'Grounds'], [/\bwater heater\b/i, 'Water heater', 'North Treatment Center']];
  var HERE = 'Mansion'; /* where the phone is: stands in for the phone point */

  /* ---- plain photo stand-ins (seed cards, and the camera when there is none) ---- */
  var SCENES = {
    outlet: '<svg viewBox="0 0 360 720" preserveAspectRatio="xMidYMid slice"><rect width="360" height="720" fill="#cdbfa6"/><rect y="560" width="360" height="160" fill="#8a6b4c"/><rect x="130" y="250" width="100" height="160" rx="8" fill="#f6f3ec" stroke="#a9a293" stroke-width="2"/><rect x="160" y="282" width="40" height="38" rx="10" fill="#e4dfd3"/><rect x="170" y="292" width="5" height="16" fill="#555"/><rect x="186" y="292" width="5" height="16" fill="#555"/><rect x="160" y="340" width="40" height="38" rx="10" fill="#e4dfd3"/><rect x="170" y="350" width="5" height="16" fill="#555"/><rect x="186" y="350" width="5" height="16" fill="#555"/></svg>',
    rug: '<svg viewBox="0 0 360 720" preserveAspectRatio="xMidYMid slice"><rect width="360" height="720" fill="#6d5038"/><polygon points="40,180 330,220 320,640 20,600" fill="#8c2f2a"/><polygon points="70,215 300,246 292,600 50,570" fill="none" stroke="#d8b46a" stroke-width="8"/><polygon points="120,300 250,318 244,500 112,484" fill="#1f3c5a" opacity=".8"/></svg>',
    room: '<svg viewBox="0 0 360 720" preserveAspectRatio="xMidYMid slice"><rect width="360" height="720" fill="#bfae94"/><polygon points="0,0 360,0 250,250 110,250" fill="#e8e2d6"/><polygon points="0,720 360,720 250,470 110,470" fill="#7a5a3e"/><polygon points="0,0 110,250 110,470 0,720" fill="#a99678"/><polygon points="360,0 250,250 250,470 360,720" fill="#b5a387"/><rect x="110" y="250" width="140" height="220" fill="#8f7d63"/></svg>'
  };

  /* ---- state ---- */
  var caps = [], seq = 0, opened = null, saidEd = false, edDirty = {};
  var press = null, lastRelease = 0, ses = null;

  function clock() { var d = new Date(), h = d.getHours() % 12 || 12; return h + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + (d.getHours() < 12 ? 'AM' : 'PM'); }
  function fmt(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function find(id) { for (var i = 0; i < caps.length; i++) if (caps[i].id === id) return caps[i]; return null; }
  function joinW(a, b) { a = (a || '').trim(); b = (b || '').trim(); return a && b ? a + ' ' + b : a || b; }

  function newCap(photo) {
    var c = { id: ++seq, photo: photo, words: '', ai: 'idle', title: null, place: null, unit: null, marks: {}, edited: {}, time: clock(), hidden: false, named: false, said: false };
    caps.push(c);
    return c;
  }
  /* seeds: real Guest House jobs, so the card look and "You said" can be tried straight away */
  (function seed() {
    var a = newCap({ svg: SCENES.rug }); a.words = 'Securing rug with sticky tape'; a.ai = 'done'; a.title = 'Antique rug securing with sticky tape, damaged edge'; a.place = 'Grounds'; a.marks = { title: true, place: true }; a.seed = true;
    var b = newCap({ svg: SCENES.outlet }); b.words = 'Tedt this outlet'; b.ai = 'done'; b.title = 'Outlet needs testing'; b.place = 'Mansion'; b.marks = { title: true, place: true }; b.seed = true;
  })();

  /* ---- the "AI": a short title from his words, the place and unit they name ---- */
  function titleFrom(text) {
    var s = text.split(/[,.;!?]| but | and then | so that /i)[0].trim();
    s = s.replace(/^((so|um|uh|okay|ok|hey|alright|right)\b[ ,]*)+/i, '').replace(/\s+/g, ' ').trim();
    var w = s.split(' ').slice(0, 6).join(' ');
    return w ? w.charAt(0).toUpperCase() + w.slice(1) : '';
  }
  function runAI(c) {
    c.ai = 'working'; c.said = false;
    var at = c.aiRun = (c.aiRun || 0) + 1;
    render(); if (opened === c.id) keepDraft(c, true);
    setTimeout(function () {
      if (c.aiRun !== at) return;
      var text = c.words.toLowerCase(), place = null, unit = null;
      PLACES.forEach(function (p) { if (!place && text.indexOf(p.toLowerCase()) >= 0) place = p; });
      UNIT_WORDS.forEach(function (u) { if (!unit && u[0].test(text) && (!place || place === u[2])) { unit = u[1]; place = place || u[2]; } });
      var t = c.words ? titleFrom(c.words) : '';
      c.marks = {};
      if (!c.edited.title) { if (t) { c.title = t; c.marks.title = true; } else c.title = 'Photo at ' + (c.place || place || HERE) + ' · ' + c.time; }
      if (!c.edited.place) { c.place = place || HERE; c.marks.place = true; }
      if (!c.edited.unit) { c.unit = unit; if (unit) c.marks.unit = true; }
      c.ai = 'done'; c.named = true;
      render(); if (opened === c.id) keepDraft(c, true);
    }, AI_MS);
  }

  /* ---------- camera ---------- */
  var video = null, track = null, micOK = false;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function note(t) { $('note').textContent = t || ''; $('note').hidden = !t; }
  function startCamera() {
